    <!--
    THESIS: um histórico clínico disperso vira um único instrumento de leitura. Recusa o
    dashboard de saúde feito de cards macios iguais e do verde-menta amigável.
    OWN-WORLD: papel de caderneta de saúde e folha de exame — fundo off-white frio, malha
    milimetrada discreta, tinta quase preta, verde-clínico profundo como única ação. Cor de
    fonte codificada em faixa fina (sinalização hospitalar), status clínico só na notação de

    linha do tempo. Public Sans, numerais tabulares, ícones autorais de traço único.
    STORY: o visitante entende que o dado dele já existe e só não está junto; acredita ao ver
    fragmentos de SUS, laboratório e papel caindo na mesma espinha com a fonte citada; abre a
    demonstração.
    FIRST VIEWPORT: título em Public Sans 900 à esquerda sobre malha; à direita a espinha
    vertical com sete fragmentos reais de fontes diferentes assentando uma vez; ação primária
    "Abrir a demonstração" logo abaixo do parágrafo de tese.
    FORM: caderneta de saúde + notação de faixa de referência (1º da lista ordenada).
    Build code-led, sem comp aprovado — sem seed key.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
    the verdict, DESIGN.md, and every shipping raster carrying its provenance.
